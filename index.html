        <!-- Custom PreStyle code is injected here -->

        <!-- High-DPI: scale the LAYOUT VIEWPORT down by devicePixelRatio so 1 CSS px == 1
             device px. window.innerWidth (GM's browser_width) then reports device resolution,
             the GML fit sizes the canvas 1:1 with what's on screen, and touch coordinates
             match canvas pixels exactly.

             Why not upscale the canvas backing store past the CSS viewport (the previous
             dprx-redirect approach)? The GM runner's touch/pointer mapping reads
             event.clientX in CSS px and transforms it against view-port bounds in CANVAS px
             with no scale correction — every tap landed at 1/dpr of its intended position
             and all buttons went dead on retina phones.

             Add ?flat=1 to the URL to disable this (renders at CSS resolution: blurry but
             a known-safe fallback if a device misbehaves). -->
        <script>
            (function () {
                var dpr = window.devicePixelRatio || 1;
                if (dpr > 1 && window.location.search.indexOf('flat') === -1) {
                    var s = 1 / dpr;
                    var vp = document.querySelector('meta[name="viewport"]');
                    vp.setAttribute('content', 'width=device-width, initial-scale=' + s
                        + ', minimum-scale=' + s + ', maximum-scale=' + s
                        + ', user-scalable=no, viewport-fit=cover');
                    // GM's DOM overlays (e.g. the get_string_async name-entry dialog) are
                    // authored in CSS px and would render 1/dpr size — counter-scale them.
                    document.documentElement.style.setProperty('--gm-ui-scale', dpr);
                }
            })();
        </script>

        <!-- Set the background colour of the document -->
        <style>

                border: 0;

            }

            #gm4html5_div_id {

            canvas {

            :-webkit-full-screen #canvas {

            /* Custom Runner Styles */
            div.gm4html5_div_class {

            div.gm4html5_login {

                color:#00ff00;
                border-radius: 15px;
                box-shadow: #101010 20px 20px 40px;
                /* Counter-scale GM's DOM dialogs under the high-DPI scaled viewport
                   (no-op when --gm-ui-scale is unset, i.e. dpr 1 or ?flat=1). */
                transform: scale(var(--gm-ui-scale, 1));
                transform-origin: center center;
            }
            div.gm4html5_login input[type="text"] {
                font-size: 16px; /* >=16px stops iOS Safari's focus auto-zoom */
            }
            div.gm4html5_cancel_button {

            div.gm4html5_login_button {

            }
            div.gm4html5_login_header {
                text-align: center;
            }
            /* END - Custom Runner Styles */

        </style>
