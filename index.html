        <!-- High-DPI bootstrap: on retina screens, redirect once to append a dprx<N> URL
             parameter (N = devicePixelRatio * 100). The GML fit in obj_jangle_controller
             reads it and sizes the canvas backing store at device resolution; the pinning
             script at the end of <body> keeps the canvas CSS size at logical pixels. -->
        <script>
            (function () {
                var dpr = window.devicePixelRatio || 1;
                if (dpr > 1 && window.location.search.indexOf('dprx') === -1) {
                    var q = window.location.search ? window.location.search + '&' : '?';
                    window.location.replace(window.location.pathname + q + 'dprx' + Math.round(dpr * 100) + '=1' + window.location.hash);
                }
            })();
        </script>

        <!-- High-DPI canvas pinning: when the game has sized the canvas backing store past
             the visible viewport (i.e. the GML fit applied its dpr upscale), display the
             canvas at (backing store / dpr) CSS pixels. If the game never upscales — dpr 1
             screens, native builds, or the dprx parameter not reaching GML — the backing
             store always fits the viewport and this stays a no-op. -->
        <script>
            (function () {
                function pin() {
                    var c = document.getElementById('canvas');
                    if (c) {
                        var dpr = window.devicePixelRatio || 1;
                        var upscaled = (c.width > window.innerWidth + 1) || (c.height > window.innerHeight + 1);
                        if (dpr > 1 && upscaled) {
                            var w = Math.round(c.width / dpr) + 'px';
                            var h = Math.round(c.height / dpr) + 'px';
                            if (c.style.width !== w) { c.style.width = w; }
                            if (c.style.height !== h) { c.style.height = h; }
                        } else if (c.style.width !== '') {
                            c.style.width = '';
                            c.style.height = '';
                        }
                    }
                    window.requestAnimationFrame(pin);
                }
                window.requestAnimationFrame(pin);
            })();
        </script>
